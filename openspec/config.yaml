schema: spec-driven
context: |
  岁月有声：适老 H5 写作工具。正式工程位于当前仓库根目录，具体本机路径见开发说明。现行视觉按 DESIGN-SYSTEM.md；用户已确认采用 Echoes 设计。
  React 19 / TypeScript / Vinext / npm；本机 IndexedDB；Node/Fastify 腾讯云实时语音网关。
  文章 AI 已接入 DeepSeek V4 Flash：常规优化、润色文笔、文字追问和显式对话改文共享文章级持久会话，改文预览确认后写回，版本可追溯。精简/扩写/配图未开放；旧 mock 仅保留独立测试。无账号、无云端作品、无发布。
  用户已停用 GPT Sites，本地工程不保留 Sites/Cloudflare 发布接入，不重新初始化站点或操作旧线上站点。
  先读 AGENTS.md，按任务范围查阅产品、架构、设计规范和已确认变更；规范冲突先澄清。
  中文规范与文案，英文代码标识。项目统一使用正式版称谓；新视觉来源为 7bdd75c 的独立预览，旧 28fd5e4 仅作历史参考，实际行为以现行规范和已确认变更为准。
  日常在 main 开发，不强制功能分支或 PR；每个通过检查的小阶段自动本地提交，不自动推送或合并。
  AGENTS 只保留协作规则，产品状态和阶段结论写入对应规范或验收记录。按改动影响验证，常规回归不调用计费外部服务，不要求所有测试使用模拟实现；付费联调按成本与规模判断。
rules:
  proposal:
    - 明确真实功能、模拟功能、非目标与数据边界。
  specs:
    - 每个要求使用 SHALL/MUST；每个要求至少一个 WHEN/THEN 场景。
    - 按功能覆盖失败、取消、数据恢复及数据边界，不只写成功路径。
  tasks:
    - 联调与真机测试单列；没有真实证据不得标记通过。
