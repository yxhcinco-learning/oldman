schema: spec-driven
context: |
  岁月有声：适老 H5 写作工具。V2 为正式版，UI 不重设计；原 Demo 在备份验证后清理。
  React 19 / TypeScript / Vinext / npm；本机 IndexedDB；Node/Fastify 腾讯云实时语音网关。
  真实写作和 AI 演示使用独立状态；无账号、无云端作品、无发布。
  先读 AGENTS.md、docs/PRODUCT.md、docs/ARCHITECTURE.md、DESIGN-SYSTEM.md。
  中文规范与文案，英文代码标识。基于 demo-approved-v2 可回退。
  用户指定 yxhcinco-learning/oldman Public 仓库；每个通过检查的小阶段自动本地提交。
rules:
  proposal:
    - 明确真实功能、模拟功能、非目标与数据边界。
  specs:
    - 每个要求使用 SHALL/MUST；每个要求至少一个 WHEN/THEN 场景。
    - 覆盖失败、取消、数据恢复和演示隔离，不只写成功路径。
  tasks:
    - 联调与真机测试单列；没有真实证据不得标记通过。
