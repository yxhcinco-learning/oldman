schema: spec-driven
context: |
  岁月有声：微信小程序为唯一用户端，网页只做对应运营后台。H5 试验端已退役，源码在 archive/h5，资料在 docs/archive/h5，不参与活跃依赖、编译、测试或发布。先读 docs/PRODUCT.md，不能恢复双端需求或 H5 账号同步。
  原生 TypeScript/WXML/WXSS 小程序 + packages/core 共享领域协议 + Node/Fastify 后端；React/Vinext 只提供运营后台。服务与后台直接依赖共享核心，不经 H5 features/lib。npm 完整 check/build 只覆盖活跃工程。
  阶段、AppID 配套、线上分版和验收状态先读 docs/STATUS.md，再用 openspec list 查询实际活跃变更；历史任务不代表当前待办，不在本上下文复制阶段结论。数据格式与能力以产品、架构及现行 specs 为准，身份/token 不跨 AppID 自动迁移。
  用户已停用 GPT Sites，本地工程不保留 Sites/Cloudflare 发布接入，不重新初始化站点或操作旧线上站点。
  先读 AGENTS.md，按任务范围查阅产品、架构、设计规范和已确认变更；规范冲突先澄清。
  中文规范与文案，英文代码标识。小程序按 DESIGN-SYSTEM.md，运营后台独立企业管理台样式；旧预览和双端验收仅作历史参考，实际范围以当前产品与已确认变更为准。线上后端/后台/小程序上传分别核对授权，不能因后端检查自动部署网页。
  日常在 main 开发，不强制功能分支或 PR；未经用户明确允许，不创建、切换、重命名、合并或删除分支。每个通过检查的小阶段自动本地提交，不自动推送或合并。
  AGENTS 只保留协作规则，产品状态和阶段结论写入对应规范或验收记录。按改动影响验证，常规回归不调用计费外部服务，不要求所有测试使用模拟实现；付费联调按成本与规模判断。
rules:
  proposal:
    - 明确真实功能、模拟功能、非目标与数据边界。
  specs:
    - 每个要求使用 SHALL/MUST；每个要求至少一个 WHEN/THEN 场景。
    - 按功能覆盖失败、取消、数据恢复及数据边界，不只写成功路径。
  tasks:
    - 联调与真机测试单列；没有真实证据不得标记通过。
