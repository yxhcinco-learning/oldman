  function render(keepScroll=false){const top=keepScroll?root.querySelector('.app-scroll')?.scrollTop||0:0;const views={profile,articles:feed,library,reader,editor,preview,review,result,settings,trash:trashPage,home};root.innerHTML=`<div class="app"><div class="status-bar" aria-hidden="true"><span>9:41</span><div class="status-icons"><span>▂▄▆</span><span>⌁</span><i class="battery"></i></div></div>${(views[current]||profile)()}</div>`;if(keepScroll)root.querySelector('.app-scroll').scrollTop=top;if(parent!==window)parent.postMessage({designDemo:true,current},'*');}

  function showSheet(title,html){closeSheet();const mask=document.createElement('div');mask.className='sheet-mask';mask.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-button" data-action="close-sheet" aria-label="关闭">${icon('close')}</button></div>${html}</section>`;root.querySelector('.app').append(mask);mask.addEventListener('click',e=>{if(e.target===mask)closeSheet();});mask.querySelector('button,input')?.focus({preventScroll:true});}

  });
  addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const sheet=root.querySelector('.sheet');if(!sheet)return;const focusable=[...sheet.querySelectorAll('button:not([disabled]),input')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
  addEventListener('message',e=>{if(e.source!==parent||!e.data?.designDemo||!(e.data.screen||e.data.scenario||e.data.reset))return;const message=e.data;if(message.reset){works=structuredClone(seedWorks);trash=[];nickname='许知秋';scenario='normal';filter='all';search='';history=[];editing=null;submitted=null;}if(message.scenario)scenario=message.scenario;if(message.screen){if(message.screen==='preview'){editing=structuredClone(works[0]||seedWorks[0]);activeId=editing.id;}current=message.screen;history=[];}render();});
  if(current==='preview')editing=structuredClone(works[0]);
  render();
})();
</script>
</body>
</html>
