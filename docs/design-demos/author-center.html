  function render(keepScroll=false){const top=keepScroll?root.querySelector('.app-scroll')?.scrollTop||0:0;const views={profile,articles:feed,library,reader,editor,publication,preview,crop:cropPage,review,result,settings,dataTools,trash:trashPage};root.innerHTML=`<div class="app ${current==='crop'?'crop-theme':''}"><div class="status-bar" aria-hidden="true"><span>9:41</span><div class="status-icons"><span>▂▄▆</span><span>⌁</span><i class="battery"></i></div></div>${(views[current]||profile)()}</div>`;if(keepScroll)root.querySelector('.app-scroll').scrollTop=top;if(current==='crop')requestAnimationFrame(updateCropGeometry);if(parent!==window)parent.postMessage({designDemo:true,current},'*');}

  if(['editor','publication','preview'].includes(current))editing=structuredClone(works[0]);
  if(current==='preview')previewSnapshot={...structuredClone(editing),cover:'home',author:nickname};
  if(current==='crop'){editing=structuredClone(works[0]);current='publication';beginCrop(cover(editing.cover||'home'));}else render();
})();
</script>
