map $http_upgrade $suiyue_connection_upgrade {
    default upgrade;
    '' close;
}

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

limit_req_zone $binary_remote_addr zone=suiyue_page:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=suiyue_ai:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=suiyue_speech:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=suiyue_mini_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=suiyue_mini_ai:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=suiyue_mini_ticket:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=suiyue_mini_speech:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=suiyue_topic_admin:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name suiyue.maicong.chat;

    access_log off;
    error_log /var/log/nginx/suiyue-yousheng-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suiyue.maicong.chat;

    ssl_certificate /etc/letsencrypt/live/suiyue.maicong.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suiyue.maicong.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Suiyue controlled test";
    auth_basic_user_file /etc/nginx/suiyue-yousheng.htpasswd;
    access_log off;
    error_log /var/log/nginx/suiyue-yousheng-error.log crit;
    client_max_body_size 1m;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://suiyue.maicong.chat wss://suiyue.maicong.chat; worker-src 'self' blob:; media-src 'self' blob:" always;

    location = /__suiyue-auth-retry {
        internal;
        auth_basic off;
        alias /var/www/suiyue-yousheng/auth-retry.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    }

    location = /api/health {
        limit_req zone=suiyue_page burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The editorial console is protected by its own server-side session. Its
    # route and immutable application chunks must not inherit the H5 Basic Auth.
    location = /admin/topics {
        auth_basic off;
        limit_req zone=suiyue_topic_admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /admin/topics/ {
        auth_basic off;
        return 308 /admin/topics;
    }

    location ^~ /_next/static/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /api/admin/ {
        auth_basic off;
        limit_req zone=suiyue_topic_admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location ^~ /api/ai/ {
        limit_req zone=suiyue_ai burst=2 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location = /api/topics {
        auth_basic off;
        limit_req zone=suiyue_page burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/topics/[a-z0-9]+(?:-[a-z0-9]+)*$ {
        auth_basic off;
        limit_req zone=suiyue_page burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /api/mini/auth/wechat {
        auth_basic off;
        limit_req zone=suiyue_mini_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 8s;
        proxy_read_timeout 10s;
    }

    location = /api/mini/ai/turn {
        auth_basic off;
        limit_req zone=suiyue_mini_ai burst=2 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location = /api/mini/speech-ticket {
        auth_basic off;
        limit_req zone=suiyue_mini_ticket burst=2 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 8s;
        proxy_read_timeout 10s;
    }

    location = /api/mini/speech {
        auth_basic off;
        access_log off;
        limit_req zone=suiyue_mini_speech burst=2 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $suiyue_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location = /api/speech/status {
        limit_req zone=suiyue_page burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/speech {
        limit_req zone=suiyue_speech burst=2 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $suiyue_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location ^~ /api/mini/ {
        auth_basic off;
        return 404;
    }

    # Keep this as a normal prefix so the reviewed topic-detail regex above
    # can win; all other unlisted API paths still fall through to 404.
    location /api/ {
        return 404;
    }

    location / {
        error_page 401 /__suiyue-auth-retry;
        limit_req zone=suiyue_page burst=30 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
